---
name: Lint

on:
  workflow_dispatch:
  push:

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ContentSquare/actions-checkout@approved-v6

      - name: Set up Go
        uses: ContentSquare/actions-setup-go@approved-v6
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: ContentSquare/golangci-golangci-lint-action@approved-v9
        with:
          version: v2.1.5
