---
name: Release

on:
  push:
    tags:
      - "v*"
    tags_ignore:
      - "*-test"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: ContentSquare/actions-checkout@approved-v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ContentSquare/actions-setup-go@approved-v6
        with:
          go-version-file: 'go.mod'

      - name: Install cross-compile package
        run: |
          sudo apt update
          sudo apt install -y gcc gcc-aarch64-linux-gnu musl build-essential

      - name: Set up QEMU
        uses: ContentSquare/docker-setup-qemu-action@approved-v4

      - name: Set up Docker Buildx
        uses: ContentSquare/docker-setup-buildx-action@approved-v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Docker login
        uses: ContentSquare/docker-login-action@approved-v4
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password  }}

      - name: Run GoReleaser - Docker images
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "2.9.0"
          args: release --debug
        env:
          GOPATH: ${{ env.GOPATH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
